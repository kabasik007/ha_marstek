name: Android read-only debug APK

on:
  push:
    branches:
      - feature/android-energy-console
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zilla-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble read-only Android app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android API 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK cmdline-tools not installed at $SDK_ROOT" >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify no state-changing Marstek protocol calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("app/src/main/java/ua/zilla/energy")
          udp = (root / "data/MarstekUdpClient.kt").read_text()
          methods = set(re.findall(r'request\(host,\s*port,\s*"([^"]+)"', udp))
          allowed = {"ES.GetStatus", "wifi.GetStatus", "ES.GetMode"}
          print("Marstek commands:", sorted(methods))
          if not methods or not methods <= allowed:
              raise SystemExit(f"Not read-only: {methods - allowed}")
          PY

      - name: Run Kotlin unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zilla-energy-readonly-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 21
